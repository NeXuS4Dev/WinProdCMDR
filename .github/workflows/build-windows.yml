name: Build Windows binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / render tests
        run: npm test

      - name: Build (renderer + main)
        run: npm run build

      - name: Package Windows targets (NSIS setup + portable)
        run: npx electron-builder --win nsis portable --publish never

      - name: Zip unpacked build
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/WinProdCMDR-win32-x64-unpacked.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinProdCMDR-windows-binaries
          path: |
            release/*.exe
            release/*unpacked.zip
          if-no-files-found: error

      - name: Publish to GitHub Release (testing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing-binaries
          name: WinProdCMDR — Windows testing binaries
          prerelease: true
          body: |
            Unsigned Windows binaries of WinProdCMDR 1.0.0 built automatically for testing.

            - **WinProdCMDR-Setup-1.0.0.exe** — NSIS installer (creates Start-menu/desktop shortcuts, uninstaller)
            - **WinProdCMDR-1.0.0-portable.exe** — single-file portable build, no installation needed (extracts on launch, slower first start)
            - **WinProdCMDR-win32-x64-unpacked.zip** — unpacked build, fastest to try repeatedly (unzip, run WinProdCMDR.exe)

            Note: binaries are unsigned, so Windows SmartScreen may show a warning — choose "More info → Run anyway".
          files: |
            release/*.exe
            release/*unpacked.zip
          fail_on_unmatched_files: true
