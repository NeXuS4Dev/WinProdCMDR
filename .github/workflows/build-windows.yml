name: Build Windows binaries

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if binaries were already delivered for this version
        id: gate
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          FILE="dist-delivery/WinProdCMDR-${VERSION}-portable.exe"
          if [ -n "$HEAD_REF" ]; then
            git fetch origin "$HEAD_REF" >/dev/null 2>&1 || true
          fi
          if git cat-file -e "FETCH_HEAD:$FILE" 2>/dev/null; then
            echo "Already delivered $FILE — skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.gate.outputs.build == 'true'
        run: npm run typecheck

      - name: Render tests
        if: steps.gate.outputs.build == 'true'
        run: npm test

      - name: Build (renderer + main)
        if: steps.gate.outputs.build == 'true'
        run: npm run build

      - name: Package Windows targets (NSIS setup + portable + unpacked)
        if: steps.gate.outputs.build == 'true'
        run: npx electron-builder --win nsis portable --publish never

      - name: Zip unpacked build
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/WinProdCMDR-win32-x64-unpacked.zip

      - name: Upload workflow artifacts
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WinProdCMDR-windows-binaries
          path: |
            release/*.exe
            release/*unpacked.zip
          if-no-files-found: error

      - name: Publish testing release
        if: steps.gate.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: testing-binaries
          name: WinProdCMDR — Windows testing binaries
          prerelease: true
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          body: |
            Unsigned Windows binaries of WinProdCMDR, built automatically for testing.

            - **WinProdCMDR-Setup-*.exe** — NSIS installer (shortcuts + uninstaller)
            - **WinProdCMDR-*-portable.exe** — single-file portable build, no installation needed (self-extracts at launch)
            - **WinProdCMDR-win32-x64-unpacked.zip** — unpacked build (unzip, run WinProdCMDR.exe — fastest startup)

            The binaries are unsigned: Windows SmartScreen may warn — choose "More info → Run anyway".
          files: |
            release/*.exe
            release/*unpacked.zip

      - name: Commit portable exe to the branch (for in-workspace delivery)
        if: steps.gate.outputs.build == 'true' && github.event.pull_request.head.sha != ''
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$HEAD_REF"
          git checkout -B delivery FETCH_HEAD
          mkdir -p dist-delivery
          cp "release/WinProdCMDR-${{ steps.gate.outputs.version }}-portable.exe" dist-delivery/
          git add dist-delivery
          git commit -m "CI: deliver portable Windows binary v${{ steps.gate.outputs.version }} for testing"
          git push origin "HEAD:$HEAD_REF"
